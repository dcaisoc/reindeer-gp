name: Publish SDK to PyPI

# Release: bump the version in sdk/pyproject.toml and sdk/reindeer_sdk/__init__.py,
# merge, then push a tag:  git tag sdk-v0.3.0 && git push origin sdk-v0.3.0
on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('sdk/pyproject.toml','rb'))['project']['version'])")
          test "sdk-v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - run: pip install build "./sdk[dev]"
      - run: python -m pytest -q sdk/tests && reindeer selftest
      - run: python -m build sdk --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reindeer-sdk/
    permissions:
      id-token: write   # PyPI trusted publishing: no password or token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
