name: Deploy

# One Cloudflare Worker serves the app and the API.
#   - merge to main            -> staging  (reindeer-gp-staging.<subdomain>.workers.dev)
#   - PR labelled "preview"    -> staging, so reviewers can try the PR there
#   - Actions -> Deploy -> Run workflow -> production   (needs approval in the "production" environment)
# Per-PR preview URLs are not available for Workers that use Durable Objects, hence the label.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; skipped politely until they exist.
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'production' || 'staging' }}
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENV_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && ' ' || '--env staging' }}
    steps:
      - name: Check for Cloudflare credentials
        if: env.CF_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set yet, so nothing was deployed. See docs/setup.md."
      - uses: actions/checkout@v4
        if: env.CF_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CF_TOKEN != ''
        with:
          node-version-file: .nvmrc
      - if: env.CF_TOKEN != ''
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - if: env.CF_TOKEN != ''
        run: npm run build
      - name: Apply database migrations
        if: env.CF_TOKEN != ''
        run: npx wrangler d1 migrations apply DB --remote $ENV_FLAG
      - name: Deploy Worker
        id: deploy
        if: env.CF_TOKEN != ''
        run: |
          # pipefail: without it, tee hides a failed deploy and the smoke test gets blamed.
          set -o pipefail
          npx wrangler deploy $ENV_FLAG 2>&1 | tee deploy.log
      - name: Smoke test
        if: env.CF_TOKEN != ''
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Wrangler did not print a workers.dev URL. Is workers.dev enabled for this Worker? See deploy.log above."
            exit 1
          fi
          echo "Deployed to $url"
          # A brand-new Worker can take a few seconds to answer.
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "$url/api/v1/health"
          echo
          curl -fsS --retry 3 --retry-delay 3 --retry-all-errors -o /dev/null "$url/"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment on the PR
        if: env.CF_TOKEN != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number,
              body: `This PR is now running on staging. It replaces whatever was there before.` });
