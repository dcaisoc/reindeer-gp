name: Deploy

# Preview for every PR, staging on every merge to main, production only by
# hand ("Run workflow" -> production). Needs repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; skipped politely until they exist.
on:
  pull_request:
    paths: ['web/**', 'engine/**', 'tracks/**', 'scripts/build-web.mjs']
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'production' || 'staging' }}
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (github.event_name == 'workflow_dispatch' && inputs.target == 'production') && 'main' || 'staging' }}
    steps:
      - name: Check for Cloudflare credentials
        if: env.CF_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set yet, so nothing was deployed. See docs/setup.md."
      - uses: actions/checkout@v4
        if: env.CF_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.CF_TOKEN != ''
        with:
          node-version-file: .nvmrc
      - if: env.CF_TOKEN != ''
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - if: env.CF_TOKEN != ''
        run: npm run build
      - name: Deploy to Cloudflare Pages
        id: pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=reindeer-gp --branch=${{ env.BRANCH }}
      - name: Comment preview link
        if: env.CF_TOKEN != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.pages.outputs.deployment-url }}';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number,
              body: `Preview deployed: ${url}\n\nAdd \`?debug\` to the URL to expose the test hook.` });
