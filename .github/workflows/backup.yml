name: Nightly backup

# Every night, export the production and staging databases (all data, including
# bot and replay files, which live in D1), encrypt them, and keep them 30 days as
# workflow artifacts. Encryption matters: artifacts of a public repository can be
# downloaded by any GitHub user. Restore with the "Restore database" workflow.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and
# BACKUP_PASSPHRASE (a long random string; keep a copy in a password manager).
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Back up ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [production, staging]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      ENV_FLAG: ${{ matrix.target == 'staging' && '--env staging' || '' }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BACKUP_PASSPHRASE; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see docs/runbook.md, Backups)."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Export the database
        run: npx wrangler d1 export DB --remote $ENV_FLAG --output backup.sql
      - name: Summarise
        run: |
          echo "### ${{ matrix.target }} backup, $(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $(du -h backup.sql | cut -f1). Rows per table:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/d1-restore.mjs counts backup.sql >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Compress and encrypt
        run: |
          gzip -9 backup.sql
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -in backup.sql.gz -out backup.sql.gz.enc
          rm backup.sql.gz
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ matrix.target }}
          path: backup.sql.gz.enc
          retention-days: 30
          if-no-files-found: error
