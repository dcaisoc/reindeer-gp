name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit tests, golden traces, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck and deterministic-maths check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Golden traces (Node)
        run: npm run test:golden
      - name: Track validator
        run: npm run validate:tracks
      - name: Track balance report
        run: npm run balance
      - name: Generated tracks are up to date
        run: npm run tracks && git diff --exit-code tracks/
      - name: Build web app
        run: npm run build
      - name: Worker bundles with Cloudflare's own tooling
        run: npm run worker:check
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  browsers:
    name: Golden traces in browsers + end-to-end
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx playwright install --with-deps chromium firefox
      - name: Golden traces in Chromium and Firefox
        run: npx tsx tests/browser/golden.browser.ts chromium firefox
      - run: npm run build
      - name: End-to-end M1 (Chromium)
        run: npx tsx tests/browser/m1.e2e.ts --shots e2e-shots
      - name: End-to-end M2 (Chromium, full server in Node)
        run: npx tsx tests/browser/m2.e2e.ts --shots e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --no-banner --redact -v
