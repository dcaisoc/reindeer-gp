name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit tests, golden traces, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck and deterministic-maths check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Load test, in-process (60 players in 30 s; the full 200-player test runs against staging)
        run: npm run loadtest:local -- --users 60 --minutes 0.5
      - name: Golden traces (Node)
        run: npm run test:golden
      - name: Track validator
        run: npm run validate:tracks
      - name: Track balance report
        run: npm run balance
      - name: Generated tracks are up to date
        run: npm run tracks && git diff --exit-code tracks/
      - name: Build web app
        run: npm run build
      - name: Worker bundles with Cloudflare's own tooling
        run: npm run worker:check
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  browsers:
    name: Golden traces in browsers + end-to-end
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx playwright install --with-deps chromium firefox
      - name: Golden traces in Chromium and Firefox
        run: npx tsx tests/browser/golden.browser.ts chromium firefox
      - run: npm run build
      - name: End-to-end M1 (Chromium)
        run: npx tsx tests/browser/m1.e2e.ts --shots e2e-shots
      - name: End-to-end M2 (Chromium, full server in Node)
        run: npx tsx tests/browser/m2.e2e.ts --shots e2e-shots
      - name: End-to-end M4 (weekly twists, badges, standings, digest)
        run: npx tsx tests/browser/m4.e2e.ts --shots e2e-shots
      - name: End-to-end M5 (accessibility audit of every page, keyboard, reduced motion, assists, GIF export)
        run: npx tsx tests/browser/m5.e2e.ts --shots e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots
          retention-days: 7

  sdk:
    name: Python SDK (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "./sdk[dev]"
      - name: Unit tests and golden traces in Python
        run: python -m pytest -q sdk/tests
      - name: Self-test from the installed package
        run: reindeer selftest

  sdk-extras:
    name: SDK data, notebooks, docs, server integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/pyproject.toml
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: SDK copies of tracks and golden traces are up to date
        run: npm run sdk:sync && git diff --exit-code sdk/reindeer_sdk/data
      - name: Notebooks are up to date with notebooks/src
        run: python scripts/build_notebooks.py --check
      - name: Install SDK with PyTorch (CPU) and notebook runner
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "./sdk[dev,gym]" nbmake matplotlib "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
      - name: Run every notebook top to bottom
        run: python -m pytest --nbmake --nbmake-timeout=900 notebooks/
        env:
          MPLBACKEND: Agg
      - name: reindeer CLI against the real server (in Node)
        run: npx tsx tests/sdk-integration.ts
        env:
          PYTHON: python
      - name: Docs site builds with no warnings
        run: mkdocs build --strict

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --no-banner --redact -v
