[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reindeer-sdk"
version = "0.3.0"
description = "Reindeer Grand Prix: the official sleigh-racing engine in Python, plus tools to train, evaluate and submit bots."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
gym = ["gymnasium>=0.29"]
dev = ["pytest>=7"]

[project.scripts]
reindeer = "reindeer_sdk.cli:main"

[project.urls]
Homepage = "https://github.com/dcaisoc/reindeer-gp"
Documentation = "https://dcaisoc.github.io/reindeer-gp/"

[tool.setuptools.packages.find]
include = ["reindeer_sdk*"]

[tool.setuptools.package-data]
reindeer_sdk = ["data/tracks/*.json", "data/twists/*.json", "data/golden/corpus/*.json", "data/golden/bots/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
